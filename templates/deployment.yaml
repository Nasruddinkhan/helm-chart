{{- range $key, $workload := .Values.workloads }}
{{- if ne $workload.enabled false }}
{{- $autoscaling := default (dict) $workload.autoscaling }}
{{- $config := default (dict) $workload.config }}
{{- $secret := default (dict) $workload.secret }}
{{- $oracle := default (dict) $.Values.oracle }}
{{- $workloadOracle := default (dict) $workload.oracle }}
{{- $probes := default (dict) $workload.probes }}
{{- $liveness := default (dict) $probes.liveness }}
{{- $readiness := default (dict) $probes.readiness }}
{{- $podAnnotations := merge (dict) (default (dict) $.Values.global.podAnnotations) (default (dict) $workload.podAnnotations) }}
{{- $podLabels := merge (dict) (default (dict) $.Values.global.podLabels) (default (dict) $workload.podLabels) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "application-stack.workloadFullname" (list $ $key $workload) }}
  labels:
    {{- include "application-stack.workloadLabels" (list $ $key $workload) | nindent 4 }}
spec:
  {{- if not (eq $autoscaling.enabled true) }}
  replicas: {{ default 1 $workload.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "application-stack.selectorLabels" (list $ $key $workload) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "application-stack.selectorLabels" (list $ $key $workload) | nindent 8 }}
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "application-stack.serviceAccountName" $ }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "application-stack.workloadName" (list $ $key $workload) }}
          image: "{{ required (printf "workloads.%s.image.repository is required" $key) $workload.image.repository }}:{{ default $.Chart.AppVersion $workload.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $workload.image.pullPolicy }}
          {{- with $workload.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ default 8080 $workload.containerPort }}
              protocol: TCP
          {{- with $workload.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $workload.envFrom (and (eq $config.enabled true) (ne $config.mountAsEnv false)) (eq $secret.enabled true) (and (eq $oracle.enabled true) (eq $workloadOracle.enabled true)) }}
          envFrom:
            {{- if and (eq $config.enabled true) (ne $config.mountAsEnv false) }}
            - configMapRef:
                name: {{ include "application-stack.workloadFullname" (list $ $key $workload) }}-config
            {{- end }}
            {{- if and (eq $oracle.enabled true) (eq $workloadOracle.enabled true) }}
            - configMapRef:
                name: {{ include "application-stack.oracleConfigMapName" $ }}
            - secretRef:
                name: {{ include "application-stack.oracleSecretName" $ }}
            {{- end }}
            {{- if eq $secret.enabled true }}
            - secretRef:
                name: {{ include "application-stack.workloadFullname" (list $ $key $workload) }}-secret
            {{- end }}
            {{- with $workload.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if eq $liveness.enabled true }}
          livenessProbe:
            httpGet:
              path: {{ default "/" $liveness.path }}
              port: http
            initialDelaySeconds: {{ default 30 $liveness.initialDelaySeconds }}
            periodSeconds: {{ default 10 $liveness.periodSeconds }}
            timeoutSeconds: {{ default 5 $liveness.timeoutSeconds }}
            failureThreshold: {{ default 3 $liveness.failureThreshold }}
          {{- end }}
          {{- if eq $readiness.enabled true }}
          readinessProbe:
            httpGet:
              path: {{ default "/" $readiness.path }}
              port: http
            initialDelaySeconds: {{ default 15 $readiness.initialDelaySeconds }}
            periodSeconds: {{ default 10 $readiness.periodSeconds }}
            timeoutSeconds: {{ default 5 $readiness.timeoutSeconds }}
            failureThreshold: {{ default 3 $readiness.failureThreshold }}
          {{- end }}
          {{- with $workload.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with $workload.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $workload.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $workload.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
