{{- $oracle := default (dict) .Values.oracle }}
{{- $secret := default (dict) $oracle.secret }}
{{- if and (eq $oracle.enabled true) (ne $secret.create false) (not $secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "application-stack.oracleSecretName" . }}
  labels:
    {{- include "application-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: oracle
type: {{ default "Opaque" $secret.type }}
{{- with $secret.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $secret.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
